<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용 서류 검토 지원</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1f2328; --muted:#5b6470; --card:#ffffff; --line:#e2e2de; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17191c; --fg:#e8e8e6; --muted:#9aa3ad; --card:#1f2226; --line:#32363b; --accent:#6fbfa8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px 24px; }
  h1 { margin:0 0 8px; font-size:1.5rem; }
  p { margin:0 0 12px; color:var(--muted); }
  .tag { display:inline-block; margin-bottom:16px; padding:2px 10px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); font-size:.85rem; }
  .note { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="tag">준비 중</span>
    <h1>채용 서류 검토 지원</h1>
    <p>결과표(CSV)를 올리면 항목별 판정, 기준 충족 개수, 참고용 순위를 한 화면에서 볼 수 있는 페이지입니다.</p>
    <p>이 화면은 배포가 잘 되는지 확인하기 위한 임시 페이지입니다. 기능 6이 완성되면 이 자리에 바뀝니다.</p>
    <p class="note">가상 데이터만 사용합니다. 실제 지원자 정보는 올리지 마세요. 서류 합격/불합격과 면접 대상은 사람이 정합니다.</p>
  </div>
</main>
</body>
</html>
